name: Release

on:
  # 推送 v* tag 時觸發正式 Release（如 git tag v0.1.0 && git push origin v0.1.0）
  push:
    tags:
      - 'v*'
  # 手動觸發（Actions 頁面按鈕；正式 tag 發布請用 tag 觸發）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js (web console build)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install web console dependencies
        run: npm ci
        working-directory: platform-core/web-console

      - name: Build & run all unit tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build platform-forge (nested Gradle 8 build)
        run: |
          # ForgeGradle 6 不支援 Gradle 9，platform-forge 是嵌套獨立構建（Gradle 8.12 wrapper）
          cd platform-forge
          ./gradlew build --no-daemon --stacktrace

      - name: Verify plugin jar contents
        run: |
          echo "=== Verifying shade jar contents ==="
          JAR=$(ls platform-core/build/libs/s12ryt-mc-base-*.jar | head -n 1)
          echo "Jar: $JAR"
          for entry in "plugin.yml" "config.yml" "web-console/index.html" "io/javalin/Javalin.class" "org/sqlite/SQLiteJDBCLoader.class" "com/google/gson/Gson.class" "dev/s12ryt/mcapp/core/S12rytPlugin.class" "dev/s12ryt/mcapp/api/App.class"; do
            jar tf "$JAR" | grep -qx "$entry" || { echo "MISSING in jar: $entry"; exit 1; }
            echo "OK: $entry"
          done
          echo "=== plugin.yml must NOT contain commands section ==="
          if unzip -p "$JAR" plugin.yml | grep -qE '^commands:'; then
            echo "FAIL: plugin.yml contains commands section (zero-command policy violated)"
            exit 1
          fi
          echo "OK: zero commands"

      # ─── 計算 Release 版本與名稱 ───
      # tag 觸發：用 tag 名（去掉 v 前綴）對照 jar 版本；手動觸發：從 gradle.properties/build 讀版本
      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # 手動觸發：從根 build.gradle.kts 抓版本 + 短 SHA 當 prerelease
            VERSION=$(grep 'version = "' build.gradle.kts | head -n1 | sed 's/.*version = "\(.*\)".*/\1/')
            if [ -z "$VERSION" ]; then
              VERSION=$(./gradlew properties --no-daemon 2>/dev/null | grep '^version:' | awk '{print $2}')
            fi
            SHA=$(git rev-parse --short HEAD)
            echo "release_tag=v${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Determined version: ${VERSION}, tag: $(grep release_tag "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          # Paper 版（shade jar，含 web-console 與全部依賴）
          cp platform-core/build/libs/s12ryt-mc-base-*.jar release-artifacts/
          # Fabric 版（Loom remapJar 產出，Jar-in-Jar 嵌入 shade jar）
          cp platform-fabric/build/libs/platform-fabric-*.jar release-artifacts/
          # NeoForge 版（ModDevGradle jarJar 產出）
          cp platform-neoforge/build/libs/platform-neoforge-*.jar release-artifacts/
          # Forge 版（FG6 產出，無版本後綴 → 改名補上）
          cp platform-forge/build/libs/platform-forge.jar release-artifacts/platform-forge-${VERSION}.jar
          # 示範 App
          cp apps/hello-app/build/libs/hello-app-*.jar release-artifacts/
          # 產出校驗和供使用者驗證
          cd release-artifacts
          sha256sum *.jar > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### 下載檔案"
            echo ""
            echo "| 檔案 | 平台 | 用途 |"
            echo "|------|------|------|"
            echo "| \`s12ryt-mc-base-${VERSION}.jar\` | **Paper 1.21.4** | **平台 plugin**（放進伺服器 \`plugins/\` 目錄） |"
            echo "| \`platform-fabric-${VERSION}.jar\` | Fabric 1.21.4 | 放進 \`mods/\`（需 fabric-api） |"
            echo "| \`platform-neoforge-${VERSION}.jar\` | NeoForge 21.1.x | 放進 \`mods/\` |"
            echo "| \`platform-forge-${VERSION}.jar\` | Forge 54.x (1.21.4) | 放進 \`mods/\` |"
            echo "| \`hello-app-${VERSION}.jar\` | 通用 | 示範 App（放進平台資料目錄的 \`apps/\` 子目錄） |"
            echo "| \`SHA256SUMS.txt\` | - | 校驗和（\`sha256sum -c SHA256SUMS.txt\`） |"
            echo ""
            echo "### 安裝"
            echo ""
            echo "1. 依你的伺服器平台下載對應 jar：Paper 放 \`plugins/\`；Fabric/NeoForge/Forge 放 \`mods/\`（Fabric 需先裝 [fabric-api](https://modrinth.com/mod/fabric-api)）"
            echo "2. **首次啟動前**，把 \`hello-app-*.jar\` 放到平台資料目錄的 \`apps/\` 子目錄（Paper：\`plugins/s12ryt-mc-base/apps/\`；Fabric/NeoForge/Forge：\`config/s12ryt-mc-base/apps/\`；目錄需自行建立，或先啟動一次讓平台自動生成後再放入並重啟）"
            echo "3. 啟動伺服器，控制台會印出首次生成的管理員密碼"
            echo "4. 開瀏覽器訪問 \`http://<伺服器IP>:8080/console/\` 登入"
            echo ""
            echo "### 完整說明"
            echo ""
            echo "詳見 [README](https://github.com/${GITHUB_REPOSITORY}#readme)"
          } > release_notes.md
          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: s12ryt-mc-base ${{ steps.version.outputs.release_tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            release-artifacts/*.jar
            release-artifacts/SHA256SUMS.txt
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: release-artifacts/
          retention-days: 14
